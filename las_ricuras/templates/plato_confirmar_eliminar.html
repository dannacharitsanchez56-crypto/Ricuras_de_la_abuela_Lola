<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Eliminar plato</title>
</head>
<body>

<h1>Eliminar plato</h1>

<p>
    ¿Estás seguro de que quieres eliminar
    <strong>{{ plato.nombre }}</strong>?
</p>

<form method="POST">

    {% csrf_token %}

    <button type="submit">
        Sí, eliminar
    </button>

    <a href="{% url 'plato_detalle' plato.id %}">
        Cancelar
    </a>

</form>

</body>
</html>
