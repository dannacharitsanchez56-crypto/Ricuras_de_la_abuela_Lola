{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bienvenido - Las Ricuras de la Abuela Lola</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            /* Fondo de madera oscura */
            background-image: linear-gradient(rgba(46, 26, 16, 0.8), rgba(46, 26, 16, 0.9)), url('https://images.unsplash.com/photo-1555396273-367ea4eb4db5?q=80&w=1600&auto=format&fit=crop');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Lato', sans-serif;
            padding: 20px;
        }

        .contenedor-bienvenida {
            /* Fondo semi-transparente con efecto de vidrio */
            background-color: rgba(253, 246, 236, 0.9); 
            backdrop-filter: blur(10px); 
            -webkit-backdrop-filter: blur(10px);
            
            padding: 50px 40px;
            border-radius: 15px;
            max-width: 480px; 
            width: 100%;
            text-align: center;
            
            border: 2px solid #d4a24c;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5);
        }
        
        .logo-portada {
            width: 170px;         
            height: 170px;
            object-fit: cover;   
            border-radius: 50%; 
            border: 4px solid #d4a24c;
            padding: 4px;
            background: #fff;
            margin-bottom: 20px;   
            box-shadow: 0 10px 25px rgba(0,0,0, 0.2); 
            animation: flotar 4s ease-in-out infinite;
        }

        @keyframes flotar {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-8px); }
            100% { transform: translateY(0px); }
        }

        .decoracion {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            margin-bottom: 20px;
        }

        .decoracion .linea {
            height: 1px;
            width: 50px;
            background-color: #d4a24c;
        }

        .decoracion i {
            color: #d4a24c;
            font-size: 14px;
        }

        h1 {
            font-family: 'Playfair Display', serif;
            color: #4a2c1b;
            font-size: 34px; 
            margin-bottom: 15px;
            line-height: 1.2;
        }

        p {
            font-size: 17px;
            font-style: italic;
            color: #6b4c35;
            margin-bottom: 35px;
        }

        /* BOTÓN CORREGIDO: Ahora usa el degradado café de tu plantilla */
        .boton-entrar {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            background: linear-gradient(135deg, #8b4513, #5c2e0e);
            color: #fff !important;
            padding: 12px 26px;
            border-radius: 25px;
            text-decoration: none;
            font-family: 'Lato', sans-serif;
            font-weight: 700;
            font-size: 16px;
            transition: 0.3s;
            border: none;
            box-shadow: 0 4px 12px rgba(92, 46, 14, 0.4);
        }

        .boton-entrar:hover {
            background: linear-gradient(135deg, #d4a24c, #b8860b);
            color: #5c2e0e !important;
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(212, 162, 76, 0.5);
        }

        @media (max-width: 500px) {
            .contenedor-bienvenida { padding: 30px 20px; }
            .logo-portada { width: 130px; height: 130px; }
            h1 { font-size: 26px; }
            p { font-size: 15px; }
        }
    </style>
</head>
<body>

    <div class="contenedor-bienvenida">
        
        <img src="{% static 'core/img/logo.png' %}" alt="Logo Abuela Lola" class="logo-portada">
        
        <div class="decoracion">
            <div class="linea"></div>
            <i class="fa-solid fa-utensils"></i>
            <div class="linea"></div>
        </div>

        <h1>¡Bienvenidos!</h1>
        <p>Las Ricuras de la Abuela Lola<br>Sabor de casa, tradición de siempre</p>
        
        <a href="{% url 'inicio' %}" class="boton-entrar">
            <i class="fa-solid fa-door-open"></i> Entrar al Sitio
        </a>
    </div>

</body>
</html>
