{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ titulo }}</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #fdf6ec;
            color: #2e241c;
            margin: 0;
            padding: 30px 20px;
        }
        .contenedor {
            max-width: 500px;
            margin: 0 auto;
            background: #fff;
            border: 1px solid #d4a24c;
            border-top: 4px solid #8b4513;
            border-radius: 14px;
            padding: 25px 30px;
            box-shadow: 0 4px 12px rgba(92, 46, 14, 0.1);
        }
        h2 { color: #5c2e0e; border-bottom: 2px solid #d4a24c; padding-bottom: 10px; }
        form p { display: flex; flex-direction: column; gap: 5px; margin: 14px 0; }
        label { font-weight: 700; color: #5c2e0e; }
        input[type="text"], input[type="email"], input[type="password"] {
            padding: 10px 14px;
            border: 2px solid #d4a24c;
            border-radius: 20px;
            background: #fdf6ec;
            font-size: 15px;
            outline: none;
        }
        input:focus { border-color: #8b4513; }
        .helptext, ul { font-size: 12px; color: #7a6a5a; }
        .errorlist { color: #c62828; list-style: none; padding: 0; margin: 0; }
        .btn {
            background: linear-gradient(135deg, #8b4513, #5c2e0e);
            color: #fff;
            padding: 10px 26px;
            border-radius: 25px;
            border: none;
            font-weight: 700;
            cursor: pointer;
            font-size: 15px;
        }
        .btn:hover { background: linear-gradient(135deg, #d4a24c, #b8860b); color: #5c2e0e; }
        .cancelar { margin-left: 15px; color: #8b4513; font-weight: 700; }
    </style>
</head>
<body>
<div class="contenedor">
    <h2>{{ titulo }}</h2>

    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn">Guardar</button>
        <a class="cancelar" href="{% url 'lista_admins' %}">Cancelar</a>
    </form>
</div>
</body>
</html>
